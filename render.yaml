services:
  - type: web
    name: newvora-hq
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemma-4-26b-a4b-it
      - key: RELOAD
        value: "false"
      - key: GOOGLE_API_KEY
        sync: false
