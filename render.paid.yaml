# This configuration is for permanent hosting on a paid Render account.
# It uses the Starter plan with a persistent 1 GB disk mounted at /data,
# ensuring the SQLite database persists across deployments and container restarts.
services:
  - type: web
    name: newvora-hq
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: newvora-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        sync: false
      - key: DB_PATH
        value: /data/newvora.db
      - key: RELOAD
        value: "false"
      - key: GOOGLE_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
